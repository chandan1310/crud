<div class="body">
<mat-card>
  <mat-card-title>Login</mat-card-title>
  <mat-card-content>
    <form>
      <mat-form-field appearance="fill">
        <mat-label>Username</mat-label>
        <input matInput type="email" name="email" [(ngModel)]="email" />
      </mat-form-field>
      
      <mat-form-field appearance="fill">
        <mat-label>Password</mat-label>
        <input matInput type="password" name="password" [(ngModel)]="password" />
      </mat-form-field>
      
      <button mat-raised-button color="primary" type="submit" (click)="login()">Log In</button>
      
      <button (click)="signInWithGoogle()" color="primary" style="text-decoration: none;" class="google">
        <img src="./img/google.png" alt="" class="img"/>Sign In with Google
      </button>

      <div class="row">
        <div class="col-7">
          <button mat-button color="primary"class="text" type="button" [routerLink]="['/signup']">Sign Up</button>
        </div>

        <div class="col-7">
          <button mat-button class="text" color="primary"class="text" type="button" [routerLink]="['/forgetpassword']">Forgot Password</button>
        </div>
      </div>
    </form>
  </mat-card-content>
</mat-card>
</div>
