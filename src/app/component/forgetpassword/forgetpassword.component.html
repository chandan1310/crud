<div class="body">
  <mat-card>
    <mat-card-title>Forgot Password?</mat-card-title>
    <mat-card-content>
      <form>
        <mat-form-field appearance="fill">
          <mat-label>Username</mat-label>
          <input matInput type="email" name="email" [(ngModel)]="email" />
        </mat-form-field>
        
        <button mat-raised-button color="primary" type="submit" (click)="sendlink()">Send link</button>
        
        <button mat-button color="primary" type="button" (click)="goBack()">Back</button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
